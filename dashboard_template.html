<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinkWard · __ROOT__</title>
<script>try{var t=localStorage.getItem("pinkward-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
  :root{
    color-scheme:light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10); --hover:rgba(11,11,11,.045);
    --accent:#2a78d6; --accent-track:#cde2fb;
    --free:#e1e0d9;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --neutral:#898781;
    --glyph:#0b0b0b;
    --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100; --c4:#e87ba4;
    --c5:#008300; --c6:#4a3aa7; --c7:#e34948; --c8:#898781;
    --tile:#e7e6e0; --tile-file:#efeee9; --tile-rest:#f4f3ef; --tile-frame:#d3d2cb; --tile-frame2:#dddcd5;
    --tint:26%; --tint-frame:46%; --tint-frame2:36%;
    /* age bands, newest to oldest: one hue, light to dark (ordinal ramp) */
    --age0:#86b6ef; --age1:#5598e7; --age2:#2a78d6; --age3:#1c5cab; --age4:#104281;
    --shadow:0 1px 2px rgba(11,11,11,.05);
    --pop:0 10px 30px rgba(11,11,11,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
      --accent:#3987e5; --accent-track:#104281;
      --free:#5f5e57;
      --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181;
      --c5:#008300; --c6:#9085e9; --c7:#e66767; --c8:#898781;
      --tile:#2c2c2a; --tile-file:#252524; --tile-rest:#212120; --tile-frame:#43433f; --tile-frame2:#373734;
      --tint:34%; --tint-frame:56%; --tint-frame2:45%;
      --age0:#9ec5f4; --age1:#6da7ec; --age2:#3987e5; --age3:#256abf; --age4:#184f95;
      --shadow:none;
      --pop:0 10px 30px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
    --accent:#3987e5; --accent-track:#104281;
    --free:#5f5e57;
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181;
    --c5:#008300; --c6:#9085e9; --c7:#e66767; --c8:#898781;
    --tile:#2c2c2a; --tile-file:#252524; --tile-rest:#212120; --tile-frame:#43433f; --tile-frame2:#373734;
    --tint:34%; --tint-frame:56%; --tint-frame2:45%;
    --age0:#9ec5f4; --age1:#6da7ec; --age2:#3987e5; --age3:#256abf; --age4:#184f95;
    --shadow:none;
    --pop:0 10px 30px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit}
  code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.92em}
  [hidden]{display:none!important}
  .wrap{max-width:1480px;margin:0 auto;padding:0 24px}
  @media (max-width:700px){.wrap{padding:0 16px}}
  .dim{color:var(--ink-2)}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .ico{display:inline-flex;width:16px;height:16px;flex:none}
  .ico svg,.lvdot svg{width:100%;height:100%;display:block}

  /* ---- header ---- */
  .top{background:var(--surface);border-bottom:1px solid var(--border)}
  .top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
    padding-top:14px;padding-bottom:14px}
  .brand{flex:1 1 320px;min-width:0}
  .eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted)}
  h1{margin:2px 0 0;font-size:20px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}
  .sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
  .search{position:relative;flex:0 1 380px;min-width:220px}
  .search>.ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);
    border-radius:8px;background:var(--page);color:var(--ink);font:inherit}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .results{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--pop);max-height:440px;overflow:auto;display:none}
  .results.open{display:block}
  .res-h{padding:8px 12px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--grid)}
  .res{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:0 8px;align-items:center;
    width:100%;padding:7px 12px;border:0;background:none;text-align:left;cursor:pointer}
  .res:hover,.res.active{background:var(--hover)}
  .res .ico{color:var(--muted)}
  .res .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .rp{grid-column:2/-1;font-size:11.5px;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .theme-btn{border:1px solid var(--border);background:transparent;border-radius:8px;
    padding:7px 11px;cursor:pointer;color:var(--ink-2);font-size:12.5px}
  .theme-btn:hover{color:var(--ink)}

  /* ---- key figures ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}
  .scopebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 -4px}
  .scopebar .lbl{color:var(--ink-2);font-size:13px}
  .scopebar .note{color:var(--ink-2);font-size:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);min-width:0}
  .kpi.clickable{cursor:pointer}
  .kpi.clickable:hover{border-color:var(--baseline)}
  .kpi.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .kpi-label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);font-weight:550}
  .kpi-value{font-size:26px;font-weight:650;letter-spacing:-.01em;margin-top:6px;line-height:1.1}
  .kpi.hero .kpi-value{font-size:48px;letter-spacing:-.02em}
  .kpi-sub{font-size:12.5px;color:var(--ink-2);margin-top:6px}
  .meter{height:8px;border-radius:0 4px 4px 0;background:var(--accent-track);margin:10px 0 0;overflow:hidden}
  .meter>i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
  .meter.warn>i{background:var(--warning)}
  .meter.crit>i{background:var(--critical)}

  /* ---- tabs ---- */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--grid);margin-bottom:16px;
    overflow-x:auto;scrollbar-width:none;scroll-margin-top:8px}
  .tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:550;
    border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

  /* ---- cards ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);min-width:0}
  .card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:4px 16px;padding:12px 16px;border-bottom:1px solid var(--grid)}
  .card-t{font-size:13.5px;font-weight:650;overflow-wrap:anywhere}
  .card-n{font-size:12.5px;color:var(--ink-2)}
  .card-b{padding:14px 16px}
  .sec-t{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px}
  .empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--surface);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px;
    color:var(--ink-2);white-space:nowrap}
  .btn:hover{color:var(--ink);border-color:var(--baseline)}
  .btn .ico{width:14px;height:14px}
  .link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;
    text-decoration:underline;text-underline-offset:2px;text-align:left;overflow-wrap:anywhere}

  /* ---- cleanup level ---- */
  .lvdot{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;
    flex:none;background:var(--lvc,var(--neutral));color:var(--glyph);padding:2.5px}
  .lv-safe{--lvc:var(--good)}
  .lv-review{--lvc:var(--warning)}
  .lv-tool{--lvc:var(--serious)}
  .lv-system,.lv-info{--lvc:var(--neutral)}
  .chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 10px 2px 3px;
    border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:550;
    background:var(--surface);white-space:nowrap;min-width:0}
  .chip>span:last-child{overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:11px;color:var(--ink-2);border:1px solid var(--border);border-radius:4px;
    padding:0 5px;white-space:nowrap}

  /* ---- explorer ---- */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px}
  .up{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--surface);border-radius:8px;padding:5px 11px 5px 8px;cursor:pointer;margin-right:8px}
  .up:hover:not(:disabled){border-color:var(--baseline)}
  .up:disabled{opacity:.45;cursor:default}
  .crumb{border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--ink-2);
    max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumb:hover{background:var(--hover);color:var(--ink)}
  .crumb.here{color:var(--ink);font-weight:650;cursor:default;background:none}
  .crumb-sep{color:var(--muted);padding:0 1px}
  .explore{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
  @media (max-width:1100px){.explore{grid-template-columns:minmax(0,1fr)}}
  #map{position:relative;height:540px;margin:10px}
  @media (max-width:700px){#map{height:360px}}
  .map-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:0 16px 12px;
    font-size:12px;color:var(--ink-2)}
  .lg-i{display:inline-flex;align-items:center;gap:6px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}

  .tile{position:absolute;overflow:hidden;border-radius:4px;background:var(--tile);cursor:pointer;color:var(--ink)}
  .tile.f{background:var(--tile-file)}
  .tile.o{background:var(--tile-rest);cursor:default}
  .tile.nest{background:var(--tile-frame)}
  .tile.nest.d2{background:var(--tile-frame2)}
  .tile.lv-safe{background:var(--tile);background:color-mix(in srgb,var(--good) var(--tint),var(--surface));
    box-shadow:inset 0 3px 0 var(--good)}
  .tile.lv-review{background:var(--tile);background:color-mix(in srgb,var(--warning) var(--tint),var(--surface));
    box-shadow:inset 0 3px 0 var(--warning)}
  .tile.lv-tool{background:var(--tile);background:color-mix(in srgb,var(--serious) var(--tint),var(--surface));
    box-shadow:inset 0 3px 0 var(--serious)}
  .tile.nest.lv-safe{background:color-mix(in srgb,var(--good) var(--tint-frame),var(--surface))}
  .tile.nest.lv-review{background:color-mix(in srgb,var(--warning) var(--tint-frame),var(--surface))}
  .tile.nest.lv-tool{background:color-mix(in srgb,var(--serious) var(--tint-frame),var(--surface))}
  .tile.nest.d2.lv-safe{background:color-mix(in srgb,var(--good) var(--tint-frame2),var(--surface))}
  .tile.nest.d2.lv-review{background:color-mix(in srgb,var(--warning) var(--tint-frame2),var(--surface))}
  .tile.nest.d2.lv-tool{background:color-mix(in srgb,var(--serious) var(--tint-frame2),var(--surface))}
  .tile:hover:not(:has(.tile:hover)){outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
  .tile.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
  /* the row and the block under the pointer light up together */
  .tile.hl{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
  .list tr.hl{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .tl{display:flex;align-items:center;gap:5px;padding:5px 7px 0;font-size:12px;font-weight:600;
    line-height:1.3;white-space:nowrap;overflow:hidden}
  .tl>span:last-child,.nest-h>.nt{overflow:hidden;text-overflow:ellipsis}
  .ts{padding:1px 7px 0;font-size:11px;color:var(--ink-2);white-space:nowrap}
  .tile.o .tl{font-weight:500;font-style:italic;color:var(--ink-2)}
  .nest-h{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;gap:6px;
    padding:3px 7px 0;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden}
  .nest-h .ts{padding:0;font-weight:400}
  .nest-in{position:absolute}

  /* ---- detail panel ---- */
  .detail .card-b{display:flex;flex-direction:column;gap:18px}
  .d-kind{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .d-name{margin:2px 0 0;font-size:19px;font-weight:650;overflow-wrap:anywhere;line-height:1.3}
  .d-path{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
  .d-path code{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--ink-2);font-size:12px;
    background:var(--page);border:1px solid var(--grid);border-radius:6px;padding:4px 7px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .stat-l{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
  .stat-v{font-size:17px;font-weight:650}
  .what{border:1px solid var(--grid);border-radius:10px;padding:12px 14px}
  .what .sec-t{margin-bottom:6px}
  .what h3{margin:8px 0 2px;font-size:15px}
  .what p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
  .what .how{margin-top:10px;font-size:13px}
  .what .how b{display:block;font-size:12px;margin-bottom:2px}
  .what code,.g-body code{background:var(--page);border:1px solid var(--grid);border-radius:4px;
    padding:0 4px;overflow-wrap:anywhere}
  .inherit{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
  .sbar{display:flex;gap:2px;height:14px;border-radius:0 4px 4px 0;overflow:hidden}
  .sbar>i{display:block;height:100%;flex:0 1 0;min-width:3px}
  .legend{margin-top:10px;display:grid}
  .lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 56px;gap:8px;align-items:center;
    font-size:12.5px;padding:3px 0}
  .lg .lvdot{width:14px;height:14px;padding:2px}
  .lg-x{grid-column:2/-1;font-size:11.5px;color:var(--muted);margin-top:-3px}

  /* ---- tables ---- */
  .table-wrap{overflow-x:auto}
  table.list{width:100%;border-collapse:collapse;font-size:13px}
  .list th{text-align:left;font-size:11.5px;font-weight:650;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--grid);
    white-space:nowrap;background:var(--surface)}
  .list th.sortable{cursor:pointer}
  .list th.sortable:hover{color:var(--ink)}
  .list th.num,.list td.num{text-align:right}
  .list td{padding:7px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
  .list tr:last-child td{border-bottom:0}
  .list tr.go{cursor:pointer}
  .list tr.go:hover{background:var(--hover)}
  .list tr.go:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .list tr.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .nm{display:flex;align-items:center;gap:8px;min-width:0}
  .nm>.ico{color:var(--muted)}
  .nm .t{min-width:0;overflow-wrap:anywhere}
  .nm .t .tag{margin-left:6px}
  .nm .t.o{font-style:italic;color:var(--ink-2)}
  .pb{display:flex;align-items:center;gap:8px;min-width:130px}
  .pb .bar{flex:1;height:6px;background:var(--grid);border-radius:0 3px 3px 0;overflow:hidden}
  .pb .bar>i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
  .pb .num{width:50px;color:var(--ink-2)}
  .catcell{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink-2)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
  .more-row td{text-align:center;padding:12px}
  .path-cell{overflow-wrap:anywhere;color:var(--ink-2);font-size:12.5px}
  @media (max-width:760px){
    .opt{display:none}
    .pb{min-width:90px}
    .list td:first-child{min-width:120px}
  }

  /* ---- cleanup ---- */
  .lvl{margin-top:26px}
  .lvl-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-bottom:10px}
  .lvl-h h2{display:flex;align-items:center;gap:8px;margin:0;font-size:17px}
  .lvl-h .lvdot{width:20px;height:20px;padding:3px}
  .lvl-h .tot{font-size:17px;font-weight:650}
  .lvl-h .hint{flex-basis:100%;color:var(--ink-2);font-size:13px}
  .lvl-h .lvl-act{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:2px}
  .seg.drives{margin-right:10px;padding:2px}
  .seg.drives button{padding:4px 11px;font-size:12px}
  .dlg-list .dlg-sum{display:flex;align-items:baseline;gap:8px}
  .dlg-list .dlg-sum .n{color:var(--ink-2);font-size:12px}
  details.grp{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    margin-bottom:8px;box-shadow:var(--shadow)}
  details.grp>summary{list-style:none;display:grid;
    grid-template-columns:minmax(0,1fr) auto 90px 16px;gap:4px 16px;align-items:center;
    padding:11px 14px;cursor:pointer}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
  .g-name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
  .g-name>span:last-child{overflow-wrap:anywhere}
  .g-size{font-weight:650}
  .g-n{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
  .chev{color:var(--muted);transition:transform .15s}
  details[open] .chev{transform:rotate(90deg)}
  .g-body{padding:2px 14px 12px;border-top:1px solid var(--grid)}
  .g-body p{margin:10px 0 0;color:var(--ink-2);font-size:13px}
  .g-body p.how{color:var(--ink)}
  .locs{margin-top:10px}
  .loc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;
    padding:6px 0;border-top:1px solid var(--grid);font-size:12.5px}
  .loc.gone code{text-decoration:line-through;opacity:.6}
  .loc code{overflow-wrap:anywhere;color:var(--ink-2)}
  .loc-more{padding-top:8px;font-size:12.5px}
  @media (max-width:600px){
    details.grp>summary{grid-template-columns:minmax(0,1fr) auto 16px}
    .g-n{grid-column:1/2;grid-row:2}
  }

  /* ---- file types ---- */
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
  @media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
  .intro{color:var(--ink-2);margin:0 0 14px;max-width:760px}
  .types{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}
  .type{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 8px;align-items:center;
    padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
    cursor:pointer;text-align:left}
  .type:hover{border-color:var(--baseline)}
  .type[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);
    background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
  .type .tt{font-weight:600;overflow-wrap:anywhere}
  .type .tn2{grid-column:2/-1;color:var(--ink-2);font-size:12px}
  .list tr.on{background:color-mix(in srgb,var(--accent) 12%,transparent)}

  /* ---- explorer bar and views ---- */
  .ex-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;
    margin-bottom:12px}
  .ex-bar .crumbs{margin-bottom:0}
  .ex-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
  .ex-tools .lbl{font-size:12px;color:var(--muted)}
  .seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:10px;
    background:var(--surface)}
  .seg button{border:0;background:none;padding:5px 14px;border-radius:7px;cursor:pointer;
    color:var(--ink-2);font-weight:550;font-size:13px}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  .trail{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
  .trail .lead{font-size:13.5px;font-weight:650;margin-right:6px}
  .trail .crumb{padding:2px 5px}

  /* ---- simple view ---- */
  .simple{display:grid;gap:16px}
  .s-hero{display:grid;gap:16px}
  .s-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
  .s-name{font-size:22px;font-weight:650;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
  .s-sub{color:var(--ink-2);font-size:13px;margin-top:3px}
  .s-size{text-align:right}
  .s-size b{display:block;font-size:40px;font-weight:650;letter-spacing:-.02em;line-height:1}
  .s-size small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:5px}
  .s-types{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink-2);margin-top:9px}
  .s-types span{display:inline-flex;align-items:center;gap:6px}
  .s-save{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:11px 14px;border-radius:10px;
    font-size:13.5px;border:1px solid var(--grid);background:var(--page)}
  .s-save b{font-weight:650}
  .s-rows{display:grid}
  .s-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 16px;gap:4px 14px;align-items:center;
    width:100%;padding:11px 16px;border:0;border-top:1px solid var(--grid);background:none;text-align:left;
    cursor:pointer}
  .s-rows>.s-row:first-child{border-top:0}
  .s-row:hover{background:var(--hover)}
  .s-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .s-row.static{cursor:default}
  .s-row.static:hover{background:none}
  .s-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--page);
    color:var(--muted);border:1px solid var(--grid)}
  .s-main{min-width:0;display:grid;gap:3px}
  .s-title{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-weight:600;overflow-wrap:anywhere}
  .s-meta{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
  .s-bar{height:8px;background:var(--grid);border-radius:0 4px 4px 0;overflow:hidden;margin-top:4px}
  .s-bar>i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
  .s-bar>i.lv-safe{background:var(--good)}
  .s-bar>i.lv-review{background:var(--warning)}
  .s-bar>i.lv-tool{background:var(--serious)}
  .s-val{text-align:right;white-space:nowrap}
  .s-val b{display:block;font-size:15px;font-weight:650}
  .s-val small{color:var(--ink-2);font-size:12px}
  .s-go{color:var(--muted)}
  .s-detail{padding:4px 16px 14px 60px;border-top:1px dashed var(--grid)}
  .s-more{width:100%;padding:12px;border:0;border-top:1px solid var(--grid);background:none;
    color:var(--accent);cursor:pointer;font-weight:550}
  .s-more:hover{background:var(--hover)}
  @media (max-width:600px){
    .s-row{grid-template-columns:30px minmax(0,1fr) auto;padding:10px 12px}
    .s-go{display:none}
    .s-detail{padding-left:16px}
    .s-size{text-align:left}
  }
  .pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 2px;border-radius:999px;
    font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface);
    background:color-mix(in srgb,var(--lvc) 16%,var(--surface));
    border:1px solid color-mix(in srgb,var(--lvc) 45%,transparent)}
  .pill .lvdot{width:15px;height:15px;padding:2px}

  /* ---- disk health ---- */
  .hp-good{--lvc:var(--good)}
  .hp-warn{--lvc:var(--warning)}
  .hp-bad{--lvc:var(--critical)}
  .hp-unknown{--lvc:var(--neutral)}
  .h-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
  .h-head .ico{color:var(--muted)}
  .h-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px;color:var(--ink-2)}
  .h-note .lvdot{flex:none;margin-top:1px}
  .h-row{display:flex;align-items:center;gap:8px}

  /* ---- deleting from the app ---- */
  .btn.danger{color:#fff;background:var(--critical);border-color:var(--critical);font-weight:600}
  .btn.danger:hover{color:#fff;filter:brightness(1.08)}
  .btn:disabled{opacity:.55;cursor:default}
  .done{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
  .done .lvdot{width:15px;height:15px;padding:2px}
  .note{font-size:12.5px;color:var(--ink-2);padding:9px 12px;border:1px dashed var(--baseline);
    border-radius:8px;margin-top:10px}
  .clean-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
  dialog.confirm{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--surface);
    color:var(--ink);box-shadow:var(--pop);width:min(580px,calc(100vw - 32px))}
  dialog.confirm::backdrop{background:rgba(0,0,0,.45)}
  .dlg-b{padding:18px 20px;display:grid;gap:12px}
  .dlg-b h2{margin:0;font-size:18px;overflow-wrap:anywhere}
  .dlg-list{max-height:220px;overflow:auto;border:1px solid var(--grid);border-radius:8px}
  .dlg-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 10px;
    border-top:1px solid var(--grid);font-size:12.5px}
  .dlg-item:first-child{border-top:0}
  .dlg-item code{grid-column:1/-1;color:var(--ink-2);overflow-wrap:anywhere}
  .dlg-notes{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;display:grid;gap:3px}
  .dlg-err{color:var(--critical);font-size:13px}
  .dlg-f{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 20px;
    border-top:1px solid var(--grid)}
  .dlg-f .btn{font-size:13px;padding:6px 14px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;background:var(--ink);
    color:var(--surface);padding:10px 16px;border-radius:10px;box-shadow:var(--pop);font-size:13px;
    width:max-content;max-width:calc(100vw - 32px);display:none}

  /* ---- tooltip, footer, errors ---- */
  .tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);
    border:1px solid var(--border);border-radius:9px;box-shadow:var(--pop);padding:8px 11px;
    font-size:12.5px;max-width:340px;display:none}
  .tip .tv{font-size:15px;font-weight:650}
  .tip .tv span{font-size:12.5px;font-weight:400;color:var(--ink-2)}
  .tip .tn{font-weight:550;overflow-wrap:anywhere}
  .tip .tx{color:var(--ink-2)}
  .tip .tr{display:flex;align-items:center;gap:6px;margin-top:5px}
  .tip .th{color:var(--muted);font-size:11.5px;margin-top:5px}
  .foot{color:var(--ink-2);font-size:12.5px;padding:28px 0 40px}
  .foot ul{margin:6px 0 0;padding-left:18px}
  .foot p{margin:0 0 8px}
  .error{background:#fde8e8;color:#7a1414;border:1px solid #f2b8b8;padding:10px 14px;
    border-radius:8px;margin:16px 0 0;display:none}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="eyebrow">PinkWard · disk analysis</div>
      <h1 id="rootName"></h1>
      <div class="sub" id="scanInfo"></div>
    </div>
    <div class="search">
      <span class="ico" id="searchIcon"></span>
      <input id="q" type="search" placeholder="Search for a folder or file (press /)" autocomplete="off"
             spellcheck="false" aria-label="Search for a folder or file" aria-controls="results">
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="theme-btn" id="theme" type="button"></button>
  </div>
</header>

<main class="wrap">
  <div class="error" id="error" role="alert"></div>
  <div class="scopebar" id="scopeBar" hidden></div>
  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" type="button" data-tab="explore">Explore</button>
    <button class="tab" role="tab" type="button" data-tab="cleanup">Cleanup</button>
    <button class="tab" role="tab" type="button" data-tab="files">Large files</button>
    <button class="tab" role="tab" type="button" data-tab="types">File types</button>
    <button class="tab" role="tab" type="button" data-tab="health">Disk health</button>
  </nav>

  <section id="tab-explore" role="tabpanel">
    <div class="ex-bar">
      <div class="crumbs" id="crumbs"></div>
      <div class="ex-tools">
        <span class="lbl" id="paintLabel" hidden>Colour by</span>
        <div class="seg" id="paintSeg" role="group" aria-label="What the colours mean" hidden>
          <button type="button" data-paint="level" aria-pressed="true"
                  title="Whether it can be cleaned">What it is</button>
          <button type="button" data-paint="type" aria-pressed="false"
                  title="What kind of files it holds">Content</button>
          <button type="button" data-paint="age" aria-pressed="false"
                  title="How long since it was last touched">Age</button>
        </div>
        <div class="seg" id="viewSeg" role="group" aria-label="Explorer view">
          <button type="button" data-view="simple" aria-pressed="true"
                  title="The essentials: what takes up the most and what can be cleaned">Simple</button>
          <button type="button" data-view="advanced" aria-pressed="false"
                  title="Block map, details and the full table">Advanced</button>
        </div>
      </div>
    </div>
    <div id="simple" class="simple"></div>
    <div id="advanced" hidden>
      <div class="explore">
        <div class="card">
          <div class="card-h">
            <div class="card-t" id="mapTitle"></div>
            <div class="card-n">Click a block to go in · Backspace to go up</div>
          </div>
          <div id="map" role="img"></div>
          <div class="map-legend" id="mapLegend"></div>
        </div>
        <aside class="card detail" id="detail" aria-live="polite"></aside>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-h"><nav class="trail" id="listTitle" aria-label="Path"></nav><div class="card-n" id="listNote"></div></div>
        <div class="table-wrap"><table class="list" id="list"></table></div>
      </div>
    </div>
  </section>
  <section id="tab-cleanup" role="tabpanel" hidden></section>
  <section id="tab-files" role="tabpanel" hidden></section>
  <section id="tab-types" role="tabpanel" hidden></section>
  <section id="tab-health" role="tabpanel" hidden></section>

  <footer class="foot" id="foot"></footer>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<dialog class="confirm" id="confirm" aria-labelledby="confirmTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Cleanup API config: server.py fills this in when it serves the dashboard. -->
<script id="api" type="application/json">null</script>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  function showError(msg) {
    const el = $("error");
    el.textContent = "Dashboard error: " + msg;
    el.style.display = "block";
  }
  window.addEventListener("error", (e) => showError(e.message || String(e)));

  let RAW;
  try {
    RAW = JSON.parse($("data").textContent);
  } catch (e) {
    showError("the scan data could not be read (" + e.message + ").");
    return;
  }

  // ---- data --------------------------------------------------------------
  const M = RAW.meta, T = RAW.nodes;
  const NAME = T.n, SIZE = T.s, FILES = T.f, PARENT = T.p, KIND = T.k, CATS = T.c;
  const AGES = T.a || [], AGE = M.ages || [];
  const COUNT = NAME.length, SEP = M.sep;
  // The scanned drives. A normal scan has one, and it is the tree itself;
  // with several, node 0 is a holder and each drive hangs off it.
  const ROOTS = (M.roots && M.roots.length) ? M.roots : [{id: 0, path: M.root, disk: M.disk}];
  const ROOT_ID = new Set(ROOTS.map((r) => r.id));
  const MULTI = ROOTS.length > 1;
  const RULES = RAW.rules, CLS = RAW.cls, DENIED = new Set(RAW.denied);
  const CAT = M.cats, LV = M.levels;
  // What Windows said about the drives. Null when it was not asked or had
  // nothing to say, and then the tab is not shown at all.
  const HEALTH = (RAW.health && (RAW.health.error || (RAW.health.disks || []).length))
    ? RAW.health : null;
  const ACTIONABLE = ["safe", "review", "tool"];
  const STATUS = {safe: "good", review: "warning", tool: "serious"};
  const DIR = 0, FILE = 1, MORE_FILES = 2, MORE_DIRS = 3;

  // Deleting from the app: only when PinkWard is serving the dashboard
  // (API != null) and only what the scan marked as cleanable ([id, bytes, 1]).
  let API = null;
  try { API = JSON.parse($("api").textContent); } catch (e) { API = null; }
  const CLEANABLE = new Map();   // id -> {rule, size}
  for (const g of RAW.clean.groups) {
    for (const [i, s, c] of g.items) if (c) CLEANABLE.set(i, {rule: RULES[g.r], size: s});
  }
  const CLEANED = new Map();     // id -> result sent back by the server
  const GONE = new Set();        // ids that no longer exist after a delete

  const KIDS = new Array(COUNT);
  for (let i = 1; i < COUNT; i++) {
    const p = PARENT[i];
    (KIDS[p] || (KIDS[p] = [])).push(i);
  }
  for (const k of KIDS) if (k) k.sort((a, b) => SIZE[b] - SIZE[a]);
  function kidsOf(i) {
    const k = KIDS[i];
    if (!k) return [];
    return GONE.size ? k.filter((x) => !GONE.has(x)) : k;
  }

  // The page always carries the scan as it was taken. Whatever PinkWard has
  // deleted since comes with the page, so reloading it does not bring back
  // what is no longer on disk. In the order it happened: a folder cleaned
  // after something inside it would not add up the same the other way round.
  if (API && API.cleaned && API.cleaned.length) {
    for (const [i, r] of API.cleaned) {
      if (i < 0 || i >= COUNT || !r) continue;
      CLEANED.set(i, r);
      if (r.ok) applyClean(i, r);
    }
  }
  if (API && API.disk) applyDisk(API.disk);

  // ---- formatting --------------------------------------------------------
  const nf = (d) => new Intl.NumberFormat("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
  const F0 = nf(0), F1 = nf(1), F2 = nf(2);
  const UNITS = ["B", "KB", "MB", "GB", "TB", "PB"];
  function human(n) {
    let i = 0, v = n;
    while (v >= 1024 && i < UNITS.length - 1) { v /= 1024; i++; }
    if (i === 0) return F0.format(v) + " B";
    return (v >= 10 ? F1 : F2).format(v) + " " + UNITS[i];
  }
  function pct(part, whole) {
    if (!whole || !part) return "0%";
    const p = part / whole * 100;
    if (p < 0.1) return "<0.1%";
    return (p >= 10 ? F0 : F1).format(p) + "%";
  }
  const count = (n) => F0.format(n);
  const plural = (n, one, many) => count(n) + " " + (n === 1 ? one : many);
  function duration(s) {
    if (s < 60) return F1.format(s) + " s";
    return Math.floor(s / 60) + " min " + Math.round(s % 60) + " s";
  }

  // ---- tree helpers ------------------------------------------------------
  const label = (i) => (i === 0 ? M.root : NAME[i]);
  function pathOf(i) {
    const parts = [];
    let n = i;
    // The drive a node sits on carries the whole path in its name; anything
    // above it (the holder of a several-drive scan) is not part of it.
    while (n > 0 && !ROOT_ID.has(n)) { parts.push(NAME[n]); n = PARENT[n]; }
    let out = NAME[n];
    while (parts.length) {
      const part = parts.pop();
      out += (out.endsWith(SEP) ? "" : SEP) + part;
    }
    return out;
  }
  function relPath(i, from) {
    if (from === 0 && MULTI) return pathOf(i);   // no common folder to cut
    const parts = [];
    for (let n = i; n > 0 && n !== from; n = PARENT[n]) parts.push(NAME[n]);
    return parts.reverse().join(SEP);
  }
  // Which scanned drive a node belongs to, or -1.
  function rootOf(i) {
    for (let n = i; n >= 0; n = PARENT[n]) if (ROOT_ID.has(n)) return n;
    return -1;
  }
  // "C:" for a whole drive, "me (C:)" for a folder inside one.
  function rootLabel(r) {
    const drive = /^[A-Za-z]:/.test(r.path) ? r.path.slice(0, 2) : "";
    const trimmed = r.path.replace(/[\\/]+$/, "");
    if (drive && trimmed.length <= 2) return drive;
    const cut = Math.max(trimmed.lastIndexOf("\\"), trimmed.lastIndexOf("/"));
    return (cut >= 0 ? trimmed.slice(cut + 1) : trimmed) + (drive ? " (" + drive + ")" : "");
  }
  const driveOf = (id) => {
    const entry = ROOTS.find((r) => r.id === id);
    return entry && /^[A-Za-z]:/.test(entry.path) ? entry.path.slice(0, 2) : "";
  };
  function ruleCtx(i) {
    for (let n = i; n >= 0; n = PARENT[n]) {
      const r = CLS[n];
      if (r !== undefined) return {rule: RULES[r], at: n};
    }
    return null;
  }
  function tintLevel(i) {
    const ctx = ruleCtx(i);
    return ctx && STATUS[ctx.rule.level] ? ctx.rule.level : null;
  }
  function comp(i) {
    const c = CATS[i];
    if (KIND[i] === DIR) {
      const out = [];
      if (c) for (let j = 0; j < c.length; j += 2) out.push([c[j], c[j + 1]]);
      return out;
    }
    if (KIND[i] === FILE) return [[c, SIZE[i]]];
    return [];
  }
  function mainCat(i) {
    let best = -1, bestSize = 0;
    for (const [c, v] of comp(i)) if (v > bestSize) { bestSize = v; best = c; }
    return best;
  }
  const catColor = (c) => "var(--c" + c + ")";

  // ---- age: when what is inside was last written --------------------------
  // Same shape as the content mix: pairs for folders, one band for a file.
  const ageColor = (b) => "var(--age" + b + ")";
  function ageComp(i) {
    const a = AGES[i];
    if (KIND[i] === DIR) {
      const out = [];
      if (a) for (let j = 0; j < a.length; j += 2) out.push([a[j], a[j + 1]]);
      return out;
    }
    if (KIND[i] === FILE && a != null && a >= 0) return [[a, SIZE[i]]];
    return [];
  }
  function mainAge(i) {
    let best = -1, bestSize = 0;
    for (const [b, v] of ageComp(i)) if (v > bestSize) { bestSize = v; best = b; }
    return best;
  }
  // Share of the bytes in here that nobody has touched for over a year.
  function coldShare(i) {
    let cold = 0, all = 0;
    for (const [b, v] of ageComp(i)) { all += v; if (b >= 3) cold += v; }
    return all ? cold / all : -1;
  }
  function coldBytes(i) {
    let cold = 0;
    for (const [b, v] of ageComp(i)) if (b >= 3) cold += v;
    return cold;
  }

  // ---- DOM ---------------------------------------------------------------
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const key in attrs) {
        const v = attrs[key];
        if (v == null || v === false) continue;
        if (key === "class") el.className = v;
        else if (key === "style") el.style.cssText = v;
        else if (key.startsWith("on")) el.addEventListener(key.slice(2), v);
        else el.setAttribute(key, v === true ? "" : v);
      }
    }
    for (const c of children) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : String(c));
    }
    return el;
  }
  const SVG = {
    safe: '<svg viewBox="0 0 16 16"><path d="M3.6 8.4l2.9 2.9L12.4 5.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    review: '<svg viewBox="0 0 16 16"><path d="M8 3.2v5.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="8" cy="12.6" r="1.5" fill="currentColor"/></svg>',

    }
    box.append(h("div", {class: "card"}, h("div", {class: "table-wrap"}, h("table", {class: "list"},
      h("thead", null, h("tr", null, h("th", {class: "num"}, "Size"), h("th", null, "File"),
        h("th", {class: "opt"}, "Folder"), h("th", {class: "opt"}, "Type"), h("th", {class: "opt"}, "What it is"))),
      body))));
  };

  // ---- file types --------------------------------------------------------
  // Pick a type (or an extension) and see its extensions and the files of
  // that type taking up the most. The choice lives in the URL:
  // #types/c6, #types/e/.mp4
  const catCell = (cat) => h("span", {class: "catcell"},
    h("span", {class: "dot", style: "background:" + catColor(cat)}), CAT[cat]);

  function renderTypes(box) {
    box.textContent = "";
    const totals = RAW.catTotals;
    const all = totals.reduce((s, t) => s + t[0], 0) || 1;
    if (!typeSel || (typeSel.cat != null && !totals[typeSel.cat][0])) {
      let best = 0;
      totals.forEach((t, c) => { if (t[0] > totals[best][0]) best = c; });
      typeSel = {cat: best};
    }
    const extEntry = typeSel.ext != null ? RAW.exts.find((e) => e[0] === typeSel.ext) : null;
    if (typeSel.ext != null && !extEntry) typeSel = {all: true};
    const selCat = typeSel.cat != null ? typeSel.cat : extEntry ? extEntry[3] : null;

    box.append(h("p", {class: "intro"},
      "Pick a type to see its extensions and the files of that type taking up the most. " +
      "Click an extension to narrow it down; click a file to see it in its folder." +
      (scope ? " They cover every drive that was scanned, not just " + scopeName() + "." : "") +
      (freedAll() ? " These totals are from the scan: what you deleted since is not taken off here." : "")));

    const head = h("div", {class: "card-b"}, h("div", {class: "sec-t"}, "By kind of content"),
      stackBar(totals.map((t, c) => ({label: CAT[c], value: t[0], color: catColor(c)})), all));
    const grid = h("div", {class: "types", role: "group", "aria-label": "Kinds of content"});
    const typeButton = (key, text, color, size, n, pressed) => h("button",
      {class: "type", type: "button", "aria-pressed": String(pressed), onclick: () => go("types/" + key)},
      color ? swatch(color) : h("span"), h("span", {class: "tt"}, text), h("span", {class: "num"}, human(size)),
      h("span", {class: "tn2"}, (size === all ? "" : pct(size, all) + " · ") + plural(n, "file", "files")));
    grid.append(typeButton("all", "All types", null, all, totals.reduce((s, t) => s + t[1], 0), !!typeSel.all));
    totals.map((t, c) => c).filter((c) => totals[c][0] > 0)
      .sort((a, b) => totals[b][0] - totals[a][0])
      .forEach((c) => grid.append(typeButton("c" + c, CAT[c], catColor(c), totals[c][0], totals[c][1], selCat === c)));
    head.append(grid);
    box.append(h("div", {class: "card"}, head));

    // Extensions of the chosen type (or of all of them).
    const exts = RAW.exts.filter((e) => selCat == null || e[3] === selCat).slice(0, selCat == null ? 40 : 15);
    const base = selCat == null ? all : totals[selCat][0] || 1;
    const maxExt = exts.length ? exts[0][2] : 1;
    const ebody = h("tbody");
    for (const [ext, n, size, cat] of exts) {
      const on = typeSel.ext === ext;
      const tr = h("tr", {class: "go" + (on ? " on" : ""), tabindex: "0", "aria-selected": String(on)},
        h("td", null, h("b", null, ext)),
        selCat == null ? h("td", {class: "opt"}, catCell(cat)) : null,
        h("td", {class: "num"}, human(size)),
        h("td", null, h("div", {class: "pb"}, h("div", {class: "bar"},
          h("i", {style: "width:" + (size / maxExt * 100).toFixed(2) + "%"})), h("span", {class: "num"}, pct(size, base)))),
        h("td", {class: "num opt"}, count(n)),
        h("td", {class: "num opt"}, human(n ? size / n : 0)));
      const pick = () => go(on ? "types/c" + cat : "types/e/" + encodeURIComponent(ext));
      tr.addEventListener("click", pick);
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
      ebody.append(tr);
    }
    const extCard = h("div", {class: "card"},
      h("div", {class: "card-h"},
        h("div", {class: "card-t"}, selCat == null ? "Extensions taking up the most" : "Extensions of " + CAT[selCat]),
        h("div", {class: "card-n"}, "Click one to see just those files")),
      exts.length
        ? h("div", {class: "table-wrap"}, h("table", {class: "list"},
            h("thead", null, h("tr", null, h("th", null, "Extension"),
              selCat == null ? h("th", {class: "opt"}, "Type") : null, h("th", {class: "num"}, "Size"),
              h("th", null, selCat == null ? "% of total" : "% of type"), h("th", {class: "num opt"}, "Files"),
              h("th", {class: "num opt"}, "Average"))), ebody))
        : h("div", {class: "empty"}, "No extensions."));

    // The largest files of whatever is selected.
    let ids, title;
    if (extEntry) {
      ids = extEntry[4];
      title = "Largest " + extEntry[0] + " files";
    } else if (selCat != null) {
      ids = RAW.typeTops[selCat] || [];
      title = CAT[selCat] + ": the largest files";
    } else {
      ids = RAW.topFiles.map((f) => f[3]).filter((x) => x >= 0);
      title = "The largest files";
    }
    ids = ids.filter((i) => !GONE.has(i));
    const filesCard = h("div", {class: "card"},
      h("div", {class: "card-h"}, h("div", {class: "card-t"}, title),
        h("div", {class: "card-n"}, ids.length ? plural(ids.length, "file", "files") : "")),
      filesTable(ids));
    box.append(h("div", {class: "two", style: "margin-top:16px"}, extCard, filesCard));
  }
  function filesTable(ids) {
    if (!ids.length) return h("div", {class: "empty"}, "No files of this type.");
    const body = h("tbody");
    for (const i of ids) {
      const ctx = ruleCtx(i);
      const tr = h("tr", {class: "go", tabindex: "0", title: pathOf(i)},
        h("td", {class: "num"}, human(SIZE[i])),
        h("td", null, h("div", {class: "nm"}, icon("file"), h("span", {class: "t"}, NAME[i]))),
        h("td", {class: "path-cell opt"}, relPath(PARENT[i], 0) || M.root),
        h("td", {class: "opt"}, ctx && ctx.rule.level !== "info" ? ruleChip(ctx.rule, ctx.at === i ? "" : "In: ") : null));
      tr.addEventListener("click", () => openNode(i, true));
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") openNode(i, true); });
      body.append(tr);
    }
    return h("div", {class: "table-wrap"}, h("table", {class: "list"},
      h("thead", null, h("tr", null, h("th", {class: "num"}, "Size"), h("th", null, "File"),
        h("th", {class: "opt"}, "Folder"), h("th", {class: "opt"}, "What it is"))), body));
  }

  // ---- disk health -------------------------------------------------------
  // All of this is Windows' own answer, asked for while the disk was being
  // scanned. PinkWard measures nothing here and changes nothing.
  function healthPill(level) {
    const text = {good: "Healthy", warn: "Worth a look", bad: "Needs attention"}[level] || "Unknown";
    const glyph = level === "good" ? "safe" : level === "unknown" ? "info" : "review";
    return h("span", {class: "pill hp-" + level}, icon(glyph, "lvdot hp-" + level), text);
  }
  function runtime(h0) {
    const years = h0 / 8760;
    const long = years >= 1 ? F1.format(years) + (years >= 2 ? " years" : " year")
      : Math.round(h0 / 24) + " days";
    return long + " (" + count(h0) + " h)";
  }
  function diskCard(d, admin) {
    const missing = admin ? "not reported" : "needs administrator";
    const where = d.scanned ? "holds the drive you scanned"
      : d.letters.length ? "drives " + d.letters.map((l) => l + ":").join(", ")
      : "no drive letters";
    const body = h("div", {class: "card-b"});
    const stats = h("div", {class: "stats"});
    stat(stats, "Windows check", d.health || "not reported");
    stat(stats, "Type", [d.media, d.bus, d.spindle ? count(d.spindle) + " rpm" : ""]
      .filter(Boolean).join(" · ") || "not reported");
    stat(stats, "Size", human(d.size));
    stat(stats, "Life left", d.life != null ? d.life + "%" : missing);
    stat(stats, "Temperature", d.temp != null ? d.temp + " °C" : missing);
    stat(stats, "Powered on", d.hours != null ? runtime(d.hours) : missing);
    stat(stats, "Uncorrected errors", (d.readErr == null && d.writeErr == null)
      ? missing : count((d.readErr || 0) + (d.writeErr || 0)));
    if (d.starts != null) stat(stats, "Power cycles", count(d.starts));
    body.append(stats);
    for (const note of d.notes) {
      body.append(h("div", {class: "h-note"}, icon("review", "lvdot hp-" + d.level),
        h("span", null, note)));
    }
    if (!d.notes.length && d.level === "good") {
      body.append(h("div", {class: "h-note"}, icon("safe", "lvdot hp-good"),
        h("span", null, "Windows sees nothing wrong with this disk.")));
    }
    return h("div", {class: "card", style: "margin-bottom:16px"},
      h("div", {class: "card-h"},
        h("div", {class: "h-head"}, icon("disk"), h("div", {class: "card-t"}, d.name),
          healthPill(d.level)),
        h("div", {class: "card-n"}, where)),
      body);
  }
  function volumesCard(H) {
    if (!H.volumes.length) return null;
    const body = h("tbody");
    for (const v of H.volumes) {
      const ok = !v.health || v.health === "Healthy";
      body.append(h("tr", {class: v.scanned ? "sel" : ""},
        h("td", null, h("div", {class: "h-row"}, h("b", null, v.letter + ":"),
          h("span", {class: "dim"}, v.label || ""))),
        h("td", {class: "opt"}, v.fs || "—"),
        h("td", null, h("span", {class: "h-row"},
          icon(ok ? "safe" : "review", "lvdot hp-" + (ok ? "good" : "warn")),
          v.health || "not reported")),
        h("td", {class: "num"}, human(v.free)),
        h("td", null, pbar(v.size - v.free, v.size))));
    }
    return h("div", {class: "card", style: "margin-bottom:16px"},
      h("div", {class: "card-h"}, h("div", {class: "card-t"}, "Volumes"),
        h("div", {class: "card-n"}, "the one you scanned is highlighted")),
      h("div", {class: "table-wrap"}, h("table", {class: "list"},
        h("thead", null, h("tr", null, h("th", null, "Drive"), h("th", {class: "opt"}, "Format"),
          h("th", null, "Windows check"), h("th", {class: "num"}, "Free"), h("th", null, "Used"))),
        body)));
  }
  function eventsCard(H) {
    const card = h("div", {class: "card"},
      h("div", {class: "card-h"}, h("div", {class: "card-t"}, "What Windows logged"),
        h("div", {class: "card-n"}, "storage messages from the last " + H.eventDays + " days")));
    if (!H.events.length) {
      card.append(h("div", {class: "card-b dim"},
        "Nothing: no storage errors or warnings in that time."));
      return card;
    }
    card.append(h("div", {class: "card-b dim"}, (H.seriousEvents
      ? plural(H.seriousEvents, "message points at a disk problem",
               "messages point at a disk problem") + "."
      : "None of them points at a disk problem; most of these are routine noise.") +
      " Windows writes them in its own language."));
    const body = h("tbody");
    for (const e of H.events) {
      body.append(h("tr", null,
        h("td", {class: "num"}, e.time),
        h("td", {class: "opt"}, e.provider + " · " + e.id),
        h("td", null, h("span", {class: "h-row"},
          icon(e.serious ? "review" : "info", "lvdot hp-" + (e.serious ? "warn" : "unknown")),
          e.level)),
        h("td", {class: "path-cell"}, e.message)));
    }
    card.append(h("div", {class: "table-wrap"}, h("table", {class: "list"},
      h("thead", null, h("tr", null, h("th", {class: "num"}, "When"),
        h("th", {class: "opt"}, "Source"), h("th", null, "Level"), h("th", null, "Message"))),
      body)));
    return card;
  }
  RENDER.health = (box) => {
    const H = HEALTH;
    box.append(h("p", {class: "intro"},
      "What Windows itself reports about the drives in this PC. PinkWard measures nothing here " +
      "and changes nothing: it asks Windows while the scan runs and shows the answer."));
    if (H.error) {
      box.append(h("div", {class: "card"}, h("div", {class: "empty"},
        "Windows did not answer: " + H.error)));
      return;
    }
    for (const d of H.disks) box.append(diskCard(d, H.admin));
    const vols = volumesCard(H);
    if (vols) box.append(vols);
    box.append(eventsCard(H));
    const notes = h("ul");
    if (!H.admin) {
      notes.append(h("li", null, "Wear, temperature and power-on hours are only handed out to an " +
        "administrator: run PinkWard again with the [A] option to see them."));
    }
    notes.append(h("li", null, "These are Windows' own numbers, not a full SMART report. A tool " +
      "made for that reads every attribute the disk keeps."));
    notes.append(h("li", null, "A disk can also fail with no warning at all. Backups, not " +
      "dashboards, are what keep your files."));
    box.append(h("div", {class: "foot"}, h("div", null, "Worth knowing:"), notes));
  };

  // ---- search ------------------------------------------------------------
  let LOWER = null, hits = [], active = -1;
  function search(q) {
    const box = $("results");
    q = q.trim().toLowerCase();
    box.textContent = "";
    active = -1;
    if (q.length < 2) { box.classList.remove("open"); return; }
    if (!LOWER) LOWER = NAME.map((s) => s.toLowerCase());
    const found = [];
    for (let i = 1; i < COUNT; i++) if (KIND[i] <= FILE && !GONE.has(i) && LOWER[i].includes(q)) found.push(i);
    found.sort((a, b) => SIZE[b] - SIZE[a]);
    hits = found.slice(0, 40);
    box.append(h("div", {class: "res-h"}, found.length
      ? plural(found.length, "result", "results") + (found.length > hits.length ? " · the " + hits.length + " largest" : "")
      : "No results. Only what the dashboard includes is searched."));
    hits.forEach((i, k) => {
      box.append(h("button", {class: "res", type: "button", role: "option", "data-k": k,
        onmousedown: (e) => e.preventDefault(), onclick: () => pick(i)},
        icon(KIND[i] === DIR ? "folder" : "file"), h("span", {class: "rn"}, NAME[i]),
        h("span", {class: "num dim"}, human(SIZE[i])), h("span", {class: "rp"}, relPath(PARENT[i], 0) || M.root)));
    });
    box.classList.add("open");
  }
  function pick(i) {
    $("results").classList.remove("open");
    $("q").blur();
    openNode(i, true);
  }
  function setupSearch() {
    const input = $("q"), box = $("results");
    let timer = null;
    input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(input.value), 120); });
    input.addEventListener("focus", () => { if (input.value.trim().length >= 2) search(input.value); });
    input.addEventListener("blur", () => setTimeout(() => box.classList.remove("open"), 150));
    input.addEventListener("keydown", (e) => {
      const rows = box.querySelectorAll(".res");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!rows.length) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length;
        rows.forEach((r, k) => r.classList.toggle("active", k === active));
        rows[active].scrollIntoView({block: "nearest"});
      } else if (e.key === "Enter") {
        if (hits.length) pick(hits[Math.max(0, active)]);
      } else if (e.key === "Escape") {
        input.value = "";
        box.classList.remove("open");
        input.blur();
      }
    });
  }

  // ---- footer, theme, keyboard -------------------------------------------
  function renderFoot() {
    const foot = $("foot");
    foot.textContent = "";
    const notes = [];
    if (freedAll()) notes.push("You deleted " + human(freedAll()) + " from this dashboard. Sizes are updated, " +
      "but the File types tab still shows the totals from the scan.");
    if (M.cloudFiles) notes.push(plural(M.cloudFiles, "file", "files") + " kept online only in OneDrive (" +
      human(M.cloudBytes) + ") are left out: they use no space on the disk.");
    if (M.sparseFiles && M.sparseSaved > 10 * 1024 * 1024) notes.push(plural(M.sparseFiles, "sparse or compressed file", "sparse or compressed files") +
      " claim " + human(M.sparseSaved) + " more than they use; the real size is what counts here.");
    if (M.links) notes.push(plural(M.links, "symlink or junction was skipped", "symlinks and junctions were skipped") +
      " so the same data is not counted twice.");
    if (M.errors) notes.push(plural(M.errors, "item could not be read", "items could not be read") +
      " because of permissions; run PinkWard as administrator to include them.");
    foot.append(h("p", null, "The dashboard includes " + plural(M.items, "item", "items") +
      " one by one (everything above " + human(M.cutoff) + "); smaller things show up grouped."));
    if (notes.length) {
      const ul = h("ul");
      for (const n of notes) ul.append(h("li", null, n));
      foot.append(h("div", null, "Notes about this scan:"), ul);
    }
    foot.append(h("div", {style: "margin-top:12px"}, "PinkWard " + (M.version || "")));
  }
  const THEMES = {auto: "Theme: auto", light: "Theme: light", dark: "Theme: dark"};
  let theme = "auto";
  try { theme = localStorage.getItem("pinkward-theme") || "auto"; } catch (e) { theme = "auto"; }
  function applyTheme() {
    if (!THEMES[theme]) theme = "auto";
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    $("theme").textContent = THEMES[theme];
  }
  function setupChrome() {
    if (!HEALTH) {
      const btn = document.querySelector('.tab[data-tab="health"]');
      if (btn) btn.hidden = true;
    }
    $("theme").addEventListener("click", () => {
      theme = {auto: "light", light: "dark", dark: "auto"}[theme];
      try { localStorage.setItem("pinkward-theme", theme); } catch (e) { /* no storage */ }
      applyTheme();
    });
    for (const b of document.querySelectorAll(".tab")) {
      b.addEventListener("click", () => go(b.dataset.tab === "explore" ? "explore/" + cur : b.dataset.tab));
    }
    for (const b of document.querySelectorAll("#viewSeg button")) {
      b.addEventListener("click", () => setView(b.dataset.view));
    }
    for (const b of document.querySelectorAll("#paintSeg button")) {
      b.addEventListener("click", () => setPaint(b.dataset.paint));
    }
    document.addEventListener("keydown", (e) => {
      const typing = /^(input|textarea|select)$/i.test(e.target.tagName || "");
      if ($("confirm").open) return;
      if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); return; }
      if (typing || tab !== "explore") return;
      if (e.key === "Backspace" || (e.altKey && e.key === "ArrowUp")) {
        if (sel != null) { e.preventDefault(); go("explore/" + cur); }
        else if (cur > 0) { e.preventDefault(); go("explore/" + PARENT[cur]); }
      }
    });
    let timer = null;
    window.addEventListener("resize", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { if (tab === "explore" && view === "advanced") renderMap(); }, 120);
    });
    window.addEventListener("hashchange", route);
  }

  applyTheme();
  renderHeader();
  renderScope();
  renderKpis();
  renderFoot();
  setupMapEvents();
  setupSearch();
  setupChrome();
  route();
})();
</script>
</body>
</html>
